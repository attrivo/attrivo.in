name: Deploy Frontend to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1

jobs:
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest

    env:
      S3_BUCKET: attrivo-in-prod
      CLOUDFRONT_DISTRIBUTION_ID: E3002WV4522P1L

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          echo "Checking website files..."
          ls -la

          test -f index.html || {
            echo "ERROR: index.html not found"
            exit 1
          }

          echo "index.html found successfully"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync website to S3
        run: |
          aws s3 sync . s3://$S3_BUCKET \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "Old version/*" \
            --exclude "*.txt" \
            --exclude ".DS_Store" \
            --cache-control "public,max-age=31536000,immutable" \
            --region $AWS_REGION

      - name: Upload index.html with no-cache
        run: |
          aws s3 cp index.html s3://$S3_BUCKET/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --region $AWS_REGION

      - name: Upload robots.txt
        if: ${{ hashFiles('robots.txt') != '' }}
        run: |
          aws s3 cp robots.txt s3://$S3_BUCKET/robots.txt \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=86400" \
            --region $AWS_REGION

      - name: Upload sitemap.xml
        if: ${{ hashFiles('sitemap.xml') != '' }}
        run: |
          aws s3 cp sitemap.xml s3://$S3_BUCKET/sitemap.xml \
            --content-type "application/xml; charset=utf-8" \
            --cache-control "public,max-age=86400" \
            --region $AWS_REGION

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Deployment complete
        run: |
          echo "======================================"
          echo "Production deployment completed"
          echo "S3 Bucket: $S3_BUCKET"
          echo "CloudFront: $CLOUDFRONT_DISTRIBUTION_ID"
          echo "======================================"
